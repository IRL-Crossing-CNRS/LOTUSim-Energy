<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LOTUSim-Energy — Paper, Video & Code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-abyss: #04182F;
    --bg-deep: #020B18;
    --surface-card: #0B2A4A;
    --surface-card-hover: #123A63;
    --border-subtle: rgba(183,216,245,0.18);
    --text-foam: #EFF5FC;
    --text-slate: #93A9C2;
    --accent-amber: #F2A623;
    --chip-bg: #F4F7FB;
    color-scheme: dark;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme: dark; }
  }
  :root[data-theme="dark"] { color-scheme: dark; }

  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }

  body {
    margin: 0;
    min-height: 100%;
    background: radial-gradient(120% 90% at 50% -10%, #0E3A63 0%, var(--bg-abyss) 45%, var(--bg-deep) 100%);
    color: var(--text-foam);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    display: flex;
    justify-content: center;
  }

  .page {
    width: 100%;
    max-width: 460px;
    padding: 44px 24px calc(36px + env(safe-area-inset-bottom, 0px));
    position: relative;
  }

  .currents {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 340px;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }
  .currents svg {
    position: absolute;
    top: -20px; left: -25%;
    width: 150%;
    height: auto;
    opacity: 0.22;
    animation: drift 34s linear infinite;
  }
  .currents svg.layer2 {
    top: 60px;
    opacity: 0.14;
    animation-duration: 46s;
    animation-direction: reverse;
  }
  @keyframes drift {
    from { transform: translateX(0); }
    to { transform: translateX(-16.6%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .currents svg { animation: none; }
  }

  header.brands {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: center;
    margin-bottom: 40px;
  }
  .brand-chip {
    background: var(--chip-bg);
    border-radius: 14px;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 18px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.28);
  }
  .brand-chip img { display: block; height: 20px; width: auto; }
  .brand-chip .divider { width: 1px; height: 22px; background: #D7DFE8; }
  .brand-chip svg.naval-logo { height: 26px; width: auto; display: block; }

  .hero {
    position: relative;
    z-index: 1;
    text-align: center;
    margin-bottom: 40px;
  }
  .hero .logo-mark {
    display: block;
    width: min(78%, 300px);
    height: auto;
    margin: 0 auto 6px;
  }
  .hero .product-suffix {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 1.4rem;
    letter-spacing: 0.01em;
    color: var(--accent-amber);
    margin: -6px 0 12px;
  }
  .hero p {
    margin: 0;
    color: var(--text-slate);
    font-size: 1.02rem;
    font-weight: 500;
    line-height: 1.45;
    max-width: 320px;
    margin-inline: auto;
  }
  .hero .venue {
    display: inline-block;
    margin-top: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    color: var(--accent-amber);
    letter-spacing: 0.02em;
  }

  .links {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .link-card {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 18px;
    background: var(--surface-card);
    border: 1px solid var(--border-subtle);
    border-radius: 16px;
    text-decoration: none;
    color: var(--text-foam);
    transition: background-color 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
  }
  .link-card:hover, .link-card:focus-visible {
    background: var(--surface-card-hover);
    border-color: rgba(242,166,35,0.45);
    transform: translateY(-1px);
  }
  .link-card:focus-visible {
    outline: 2px solid var(--accent-amber);
    outline-offset: 2px;
  }
  .link-card:active { transform: translateY(0); }

  .icon-well {
    flex: none;
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: rgba(239,245,252,0.06);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-well svg { width: 22px; height: 22px; }

  .link-text { flex: 1; min-width: 0; }
  .link-text .title {
    font-weight: 500;
    font-size: 1.02rem;
  }
  .link-text .sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    color: var(--text-slate);
    margin-top: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .chevron { flex: none; opacity: 0.55; }

  footer {
    position: relative;
    z-index: 1;
    text-align: center;
    margin-top: 40px;
    color: var(--text-slate);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.02em;
  }
</style>
</head>
